# S15 · gate de segredos antes de cada commit.
# Instalar uma vez:  pip install pre-commit && pre-commit install
# (gitleaks é descarregado automaticamente pelo hook)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml", "--redact"]
