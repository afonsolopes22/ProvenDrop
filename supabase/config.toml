# Configuração local do Supabase CLI (opcional). O deploy das funções usa
# `supabase functions deploy <nome> --no-verify-jwt`: o Stripe e o pg_cron
# não enviam JWT do Supabase; a autenticação é feita pela assinatura do
# webhook e pelo cabeçalho x-cron-secret, respetivamente.
project_id = "provendrop"

[functions.stripe-webhook]
verify_jwt = false

[functions.email-diario]
verify_jwt = false

[functions.reconciliar]
verify_jwt = false

# Chamada pelo browser (bem-vindo.html) sem sessão: valida a sessão de checkout no Stripe e tem rate-limit por IP.
[functions.corrigir-email]
verify_jwt = false

# Chamada por admin.html com o JWT do utilizador: a função valida-o ela própria e só aceita ADMIN_EMAIL.
[functions.admin-click]
verify_jwt = false

# Chamada pelo browser (bem-vindo-click.html) sem sessão: devolve só a loja indicada no checkout Click
# (para a mensagem de WhatsApp), a partir do ?session_id=, validado no Stripe; nunca e-mail, nome ou telefone.
[functions.loja-click]
verify_jwt = false
