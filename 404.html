<title>Page not found · ProvenDrop</title>
<!-- GitHub Pages serves this file for every unknown path. Two jobs (2026-11-08, plan R7):
     1. short collection links from the Click WhatsApp message, provendrop.com/c/<id> (six characters, no 0/O/1/I),
        go to the member area as app.html?c=<id>, which opens that collection after sign-in; a /c/ link with a bad
        id just opens the member area;
     2. any other path shows this "Page not found" page.
     Paths are absolute (/tailwind.css, /app.html) because this page is served at any depth. No CSP here (like the
     legal pages), so the small decision script lives inline and runs before the page paints. -->
<script>
  /* pdDestino(pathname) → "/app.html?c=<ID>" for /c/<valid id>, "/app.html" for any other /c/… path, null otherwise. */
  window.pdDestino = function(pathname){
    var m = /^\/c\/([^\/?#]*)\/?$/i.exec(String(pathname || ""));
    if(!m) return null;
    var id = "";
    try { id = decodeURIComponent(m[1]).trim().toUpperCase(); } catch(e) { id = ""; }
    return /^[A-HJ-NP-Z2-9]{6}$/.test(id) ? "/app.html?c=" + id : "/app.html";
  };
  (function(){ var d = window.pdDestino(location.pathname); if(d) location.replace(d); })();
</script>
